services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_DB_PATH: /app/data/app_d2.db
      VECTOR_STORE_DIR: /app/data/vector_store
      HF_HOME: /app/data/huggingface
      SEED_DATABASE: "true"
      FISH_API_KEY: ""
    expose:
      - "8000"
    volumes:
      - app-data:/app/data
    command:
      - uvicorn
      - app.backend.http_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_DB_PATH: /app/data/app_d2.db
      VECTOR_STORE_DIR: /app/data/vector_store
      HF_HOME: /app/data/huggingface
      UI_BACKEND: real
      SUPPORT_API_URL: http://api:8000
      SEED_DATABASE: "false"
      LIVEKIT_URL: ""
      LIVEKIT_API_KEY: ""
      LIVEKIT_API_SECRET: ""
      FISH_API_KEY: ""
    ports:
      - "8501:8501"
    volumes:
      - app-data:/app/data
    depends_on:
      api:
        condition: service_healthy

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      SUPPORT_API_URL: http://api:8000
      SEED_DATABASE: "false"
      FISH_API_KEY: ""
    depends_on:
      api:
        condition: service_healthy
    command:
      - python
      - -m
      - app.voice.agent
      - start

volumes:
  app-data:
