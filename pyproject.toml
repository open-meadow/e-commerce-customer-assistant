[project]
name = "ecommerce-support-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rukum Maurya", email = "rukummaurya2@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "livekit-agents[openai]~=1.8",
    "livekit-api~=1.0",
    "openai>=3.49.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
ecommerce-support-assistant = "ecommerce_support_assistant:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
